name = "autoweb-api"
main = "src/index.ts"
compatibility_date = "2025-07-28"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://autoweb.animalmusicstudio.com"
RESEND_FROM_EMAIL = "AutoWeb <noreply@mail.animalmusicstudio.com>"
PUBLIC_SITE_URL_TEMPLATE = "https://{slug}.autoweb.animalmusicstudio.com"

# Configure production secrets with:
# pnpm wrangler secret put JWT_SECRET
# pnpm wrangler secret put RESEND_API_KEY
# pnpm wrangler secret put GOOGLE_PLACES_API_KEY
#
# RESEND_FROM_EMAIL becomes usable after mail.animalmusicstudio.com
# is verified in Resend.

[[d1_databases]]
binding = "DB"
database_name = "autoweb-db"
database_id = "193c1e8e-5baa-43c0-9b54-58a0f9d2e0ce"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "autoweb-images"
