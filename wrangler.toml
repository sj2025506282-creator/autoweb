name = "autoweb"
compatibility_date = "2025-07-28"

# To deploy, replace "local-dev" with your real D1 database ID from:
#   npx wrangler d1 list
# or the Cloudflare Dashboard (Workers & Pages > D1 > autoweb-db)
[[d1_databases]]
binding = "DB"
database_name = "autoweb-db"
database_id = "local-dev"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "autoweb-images"
