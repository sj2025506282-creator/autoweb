name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:size
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm --filter @autoweb/api exec tsc --noEmit
      - run: pnpm --filter @autoweb/api build
      - run: pnpm --filter @autoweb/web build
        env:
          API_BASE_URL: https://api.example.invalid

  deploy-api:
    needs: quality
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: cd apps/api && npx wrangler d1 migrations apply autoweb-db --remote
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CF_API_TOKEN }}" }
      - run: cd apps/api && npx wrangler deploy
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CF_API_TOKEN }}" }

  deploy-web:
    needs: deploy-api
    if: vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @autoweb/web run deploy
        env:
          CLOUDFLARE_API_TOKEN: "${{ secrets.CF_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CF_ACCOUNT_ID }}"
          API_BASE_URL: "${{ secrets.API_BASE_URL }}"
          NEXT_PUBLIC_MAIN_DOMAIN: "${{ vars.MAIN_DOMAIN }}"
